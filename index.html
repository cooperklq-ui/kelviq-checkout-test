<!doctype html> <html lang="en"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Demo Shop – Kelviq checkout test</title> <link rel="stylesheet" href="style.css"> <script src="https://cdn.jsdelivr.net/npm/@kelviq/js-checkout@1/dist/kelviq.js"></script> </head> <body> <header> <a class="logo" href="./">🛍️ Demo Shop</a> <span>Live test site (GitHub Pages)</span> </header> <div class="container"> <h1>Kelviq checkout test</h1> <p class="subtitle"> GitHub Pages can't keep the secret API key, so checkout links are made on your computer: run <code>node make-link.js</code> in the shop folder, then paste the link here. </p> <div id="message" class="message"></div> <div class="box"> <label for="url"><b>Checkout link</b></label> <input id="url" placeholder="https://sandboxcheckout.kelviq.com/..."> <div class="row"> <button class="btn btn-primary" id="overlay">Open overlay — Kelviq.open()</button> <button class="btn btn-secondary" id="inline">Show inline — Kelviq.embed()</button> </div> </div> <div id="checkout"></div> <h3>Event log</h3> <div id="log"></div> </div> <script> const $ = (id) => document.getElementById(id); const logEl = $('log'); function log(text) { logEl.textContent += new Date().toLocaleTimeString() + ' ' + text + '\n'; logEl.scrollTop = logEl.scrollHeight; } function showMessage(text, type) { $('message').textContent = text; $('message').className = 'message ' + type; } window.addEventListener('message', (e) => { if (e.data && e.data.source === 'kelviq-checkout') log('raw ' + JSON.stringify(e.data) + ' (from ' + e.origin + ')'); }); const fromQuery = new URLSearchParams(location.search).get('checkout'); if (fromQuery) $('url').value = fromQuery; function getUrl() { const url = $('url').value.trim(); if (!url) { showMessage('Paste a checkout link first.', 'error'); return null; } return url; } const callbacks = (mode) => ({ onLoaded: () => log(mode + ' onLoaded'), onSuccess: (order) => { log(mode + ' onSuccess ' + JSON.stringify(order)); showMessage('Paid! Order ' + (order && order.orderId), 'success'); }, onClose: () => log(mode + ' onClose'), onError: (err) => { log(mode + ' onError ' + JSON.stringify(err)); showMessage('Checkout error: ' + (err.message || err.code), 'error'); }, }); $('overlay').onclick = () => { const url = getUrl(); if (!url) return; log('Kelviq.open()'); Kelviq.open({ url, ...callbacks('overlay') }); }; let inline = null; $('inline').onclick = () => { const url = getUrl(); if (!url) return; if (inline) inline.destroy(); $('checkout').innerHTML = ''; log('Kelviq.embed()'); inline = Kelviq.embed({ url, container: '#checkout', ...callbacks('inline') }); }; log('Page origin: ' + location.origin + ' SDK loaded: ' + (typeof Kelviq !== 'undefined')); </script> </body> </html>
